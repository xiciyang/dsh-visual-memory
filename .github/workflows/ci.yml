name: ci

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: python deps (pixel engine)
        run: python3 -m pip install --quiet pillow
      - name: unit + integration checks
        run: npm test
      - name: bundle contract
        run: node -e "const p=require('./package.json'); if(!p.dsh?.bundle?.patch) process.exit(1); console.log('bundle patch:', p.dsh.bundle.patch)"
